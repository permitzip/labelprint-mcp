[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labelprint"
version = "0.1.0"
description = "Local MCP server and CLI that print PNG labels to a nearby thermal label printer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "PermitZIP" }]
keywords = ["mcp", "label", "printer", "thermal", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Printing",
]
dependencies = [
  "mcp>=1.28,<2",
  "pillow>=10.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyserial>=3.5",
]

[project.optional-dependencies]
qr = ["segno>=1.6"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/permitzip/labelprint-mcp"
Repository = "https://github.com/permitzip/labelprint-mcp"
Issues = "https://github.com/permitzip/labelprint-mcp/issues"

[project.scripts]
labelprint = "labelprint.cli:main"
labelprint-mcp = "labelprint.mcp_server:main"

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.wheel.force-include]
"src/labelprint/native/macos/rfcomm_bridge.swift" = "labelprint/native/macos/rfcomm_bridge.swift"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/NOTICE",
  "/LICENSE",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
